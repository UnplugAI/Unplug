name: Unplug PR agent scan
description: Scan changed agent/MCP config files with unplug-ai (regex-only Guard)

inputs:
  base-ref:
    description: Base branch name for git diff (e.g. dev or main)
    required: false
    default: dev
  python-version:
    description: Python version for the scan job
    required: false
    default: "3.12"
  working-directory:
    description: Directory containing pyproject.toml for unplug-ai (sdk/ in this repo)
    required: false
    default: sdk
  install-mode:
    description: "local = uv sync in working-directory; pypi = pip install unplug-ai"
    required: false
    default: local
  unplug-version:
    description: PyPI version constraint when install-mode is pypi
    required: false
    default: ">=0.6.0,<0.7"

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
        version: "0.6.14"

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install unplug-ai (local dev tree)
      if: inputs.install-mode == 'local'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv sync --all-extras --dev

    - name: Install unplug-ai (PyPI)
      if: inputs.install-mode == 'pypi'
      shell: bash
      env:
        UNPLUG_VERSION: ${{ inputs.unplug-version }}
      run: uv pip install --system "unplug-ai${UNPLUG_VERSION}"

    - name: Scan changed agent files
      shell: bash
      env:
        INSTALL_MODE: ${{ inputs.install-mode }}
        WORK_DIR: ${{ inputs.working-directory }}
        BASE_REF: ${{ inputs.base-ref }}
      run: |
        set -euo pipefail
        if [ "$INSTALL_MODE" = "local" ]; then
          cd "$WORK_DIR"
          uv run unplug-scan-pr --base-ref "$BASE_REF" --repo-root "$(git rev-parse --show-toplevel)"
        else
          python -m unplug.cli.scan_pr --base-ref "$BASE_REF" --repo-root "$(git rev-parse --show-toplevel)"
        fi
