name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  sdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          version: "0.6.14"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          if [ "${{ matrix.python-version }}" = "3.13" ]; then
            # Skip ml/litellm on the 3.13 test matrix (heavy); wheel-only resolve
            # for [ml] is covered by the packaging-ml-wheels job below.
            uv sync --extra scrape --extra yara --extra haystack --extra presidio --dev
          else
            uv sync --all-extras --dev
          fi

      - name: Type check (mypy)
        run: make typecheck

      - name: CI gate (make check-ci; docker E2E is local-only)
        env:
          RUN_DOCKER_E2E: ""
        run: |
          if [ "${{ matrix.python-version }}" = "3.13" ]; then
            make lint
            uv run ruff format --check .
            uv run pytest -q -m "not requires_docker and not requires_ml and not requires_ml_weights"
          else
            make check-ci
          fi

      - name: Coverage report
        if: matrix.python-version == '3.12'
        run: make test-cov

      - name: Coverage comment
        # Fork PRs get a read-only token, so the comment step would 403.
        if: matrix.python-version == '3.12' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: MishaKav/pytest-coverage-comment@dd5b80bde6d16941f336518e92929e89069d8451 # v1.7.2
        with:
          pytest-xml-coverage-path: sdk/coverage.xml
          junitxml-path: sdk/pytest.xml
          title: SDK Coverage
          badge-title: coverage
          xml-skip-covered: true
          report-only-changed-files: true
          default-branch: dev

  # Catch sdist-only transitive breakage that plain lock/compile misses
  # (e.g. tokenizers without a cp313 wheel). Dry-run — no torch download.
  packaging-ml-wheels:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          version: "0.6.14"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Resolve unplug-ai[ml] wheels-only
        run: uv pip compile --python-version 3.13 --extra ml --no-build -o /tmp/ml-wheels.txt pyproject.toml
