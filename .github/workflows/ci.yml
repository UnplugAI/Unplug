name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  sdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          version: "0.6.14"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          if [ "${{ matrix.python-version }}" = "3.13" ]; then
            # tokenizers 0.19 (pulled by ml/litellm) has no cp313 wheels yet — skip those extras.
            uv sync --extra dev --extra scrape --extra yara --extra haystack --extra presidio --group dev
          else
            uv sync --all-extras --dev
          fi

      - name: Type check (mypy)
        run: make typecheck

      - name: CI gate (make check-ci; docker E2E is local-only)
        env:
          RUN_DOCKER_E2E: ""
        run: |
          if [ "${{ matrix.python-version }}" = "3.13" ]; then
            make lint
            uv run ruff format --check .
            uv run pytest -q -m "not requires_docker and not requires_ml and not requires_ml_weights"
          else
            make check-ci
          fi

      - name: Coverage report
        if: matrix.python-version == '3.12'
        run: make test-cov

      - name: Coverage comment
        # Fork PRs get a read-only token, so the comment step would 403.
        if: matrix.python-version == '3.12' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: MishaKav/pytest-coverage-comment@fd9adbdca9fdfbe2b9bfa44a7340e6a83346ce6c # v1.10.0
        with:
          pytest-xml-coverage-path: sdk/coverage.xml
          junitxml-path: sdk/pytest.xml
          title: SDK Coverage
          badge-title: coverage
          xml-skip-covered: true
          report-only-changed-files: true
          default-branch: dev
