name: Integrations (live)

# Live agent-framework coverage. Each matrix leg installs ONE framework extra in an
# isolated env and runs that framework's live test, so a single SDK's dependency tree
# can't mask or break another. Kept off the default PR gate (the core CI matrix no
# longer installs agent frameworks — see `all` extra in pyproject.toml); runs on PRs
# that touch the integration surface, nightly, and on demand.

on:
  pull_request:
    branches: [dev]
    paths:
      - "sdk/src/unplug/integrations/**"
      - "sdk/tests/optional/live/**"
      - "sdk/pyproject.toml"
      - ".github/workflows/integrations-live.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: langgraph
            test: tests/optional/live/test_langgraph_live.py
          - extra: agno
            test: tests/optional/live/test_agno_live.py
          - extra: crewai
            test: tests/optional/live/test_crewai_live.py
          - extra: autogen
            test: tests/optional/live/test_autogen_live.py
          - extra: llama-index
            test: tests/optional/live/test_llama_index_live.py
          - extra: pydantic-ai
            test: tests/optional/live/test_pydantic_ai_live.py
          - extra: semantic-kernel
            test: tests/optional/live/test_semantic_kernel_live.py
          - extra: openai-agents
            test: tests/optional/live/test_openai_agents_live.py
          - extra: langchain
            test: tests/optional/live/test_langchain_live.py
          - extra: google-adk
            test: tests/optional/live/test_google_adk_live.py
          - extra: smolagents
            test: tests/optional/live/test_smolagents_live.py
          - extra: dspy
            test: tests/optional/live/test_dspy_live.py
          - extra: strands
            test: tests/optional/live/test_strands_live.py
          - extra: letta
            test: tests/optional/live/test_letta_live.py
          - extra: griptape
            test: tests/optional/live/test_griptape_live.py
          - extra: ag2
            test: tests/optional/live/test_ag2_live.py
          - extra: atomic-agents
            test: tests/optional/live/test_atomic_agents_live.py
    name: live (${{ matrix.extra }})
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.6.14"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install (fresh per-framework resolution — matches `pip install "unplug-ai[extra]"`)
        # Deliberately NOT `uv sync` from the unified lock: that lock co-resolves
        # every extra together and pins some frameworks down to old, broken
        # releases (e.g. semantic-kernel 1.15, which imports `Url` from
        # `pydantic.networks` — gone in Pydantic v2). A user never installs all
        # frameworks at once; they run `pip install "unplug-ai[langgraph]"`, which
        # resolves that one framework freshly. We mirror that here.
        run: |
          uv venv
          # Framework extra freshly resolved; pytest via dependency-group (not a PyPI extra).
          uv pip install -e ".[${{ matrix.extra }}]" --group dev

      - name: Live integration test
        run: |
          # The install step above is unconditional, so by the time we get here
          # the extra is present. That leaves one meaning for a collection skip:
          # the framework is installed and will not import. The old step turned
          # that into a warning and exit 0, so a leg could stop testing anything
          # and still report success. It has been doing exactly that for ag2.
          #
          # Import first, so the log names the break instead of leaving a reader
          # to infer it from a skip count. The module name comes out of the test
          # file's own importorskip rather than a table here, which would be a
          # second place to keep in step.
          # Read with python rather than sed. A sed pattern pinned to double
          # quotes and no inner whitespace matches all 17 files today and would
          # extract nothing the moment one is reformatted with single quotes or a
          # minversion kwarg, turning a working leg into a "no import probe"
          # failure. Comment lines are dropped so a commented-out importorskip
          # cannot be picked up instead of the real one.
          module=$(.venv/bin/python -c 'import re, sys; code = "\n".join(l for l in open(sys.argv[1], encoding="utf-8").read().splitlines() if not l.lstrip().startswith("#")); m = re.search(r"importorskip\(\s*[\x27\"]([A-Za-z0-9_.]+)[\x27\"]", code); print(m.group(1) if m else "")' "${{ matrix.test }}")
          if [ -z "$module" ]; then
            echo "::error title=No import probe::${{ matrix.test }} has no importorskip, so this leg cannot tell a broken framework from a missing one."
            exit 1
          fi
          if ! .venv/bin/python -c "import $module"; then
            echo "::error title=Framework unimportable::${{ matrix.extra }} installed but 'import $module' fails, so its live tests cover nothing."
            exit 1
          fi

          set +e
          .venv/bin/python -m pytest -q -m requires_integrations "${{ matrix.test }}"
          rc=$?
          set -e
          # The framework imports, so nothing collected means the tests went
          # away rather than the framework being broken. Also a failure.
          if [ "$rc" -eq 5 ]; then
            echo "::error title=No live tests collected::${{ matrix.extra }} imports fine but ${{ matrix.test }} collected nothing."
            exit 1
          fi
          exit $rc
