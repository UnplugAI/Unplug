name: Publish to PyPI

# Releases run the full CI gate before building.
# Auth: GitHub Environment "pypi" secret PYPI_TOKEN (uv publish).
# Optional: configure PyPI Trusted Publishing for OIDC — see PUBLISH.md.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          version: "0.6.14"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --all-extras --dev

      - name: CI gate (make check-ci; docker E2E is local-only)
        env:
          RUN_DOCKER_E2E: ""
        run: make check-ci

      - name: Build
        run: uv build

      - name: Publish unplug-ai
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish --check-url https://pypi.org/pypi/unplug-ai/json
