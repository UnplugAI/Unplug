name: Publish to PyPI

# Releases run the full CI gate before building.
# Auth: GitHub Environment "pypi" secret PYPI_TOKEN (uv publish).
# Optional: configure PyPI Trusted Publishing for OIDC — see PUBLISH.md.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          version: "0.6.14"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --all-extras --dev

      - name: CI gate (make check-ci; docker E2E is local-only)
        env:
          RUN_DOCKER_E2E: ""
        run: make check-ci

      - name: Build
        run: uv build

      - name: Publish unplug-ai
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish --check-url https://pypi.org/pypi/unplug-ai/json
