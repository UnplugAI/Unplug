[project]
name = "unplug-ai"
version = "0.6.0"
description = "Unplug the bad AI. Fast prompt injection detection and redaction for LLM apps, agents, and RAG pipelines."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Chirag Gupta" }]
keywords = ["llm", "prompt-injection", "ai-safety", "guardrails", "security", "agents", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
ml = [
    "huggingface_hub>=0.23",
    "onnxruntime>=1.17",
    "transformers>=4.44,<6",
    "sentencepiece>=0.2",
    "numpy>=1.26",
    "torch>=2.0",
]
litellm = [
    "litellm>=1.40",
]
yara = [
    "yara-python>=4.5",
]
scrape = [
    "firecrawl-py>=1.0",
    "python-dotenv>=1.2.2",
]
haystack = [
    "haystack-ai>=2.0",
]
presidio = [
    "presidio-analyzer>=2.2",
    "click>=8.0",
]
langgraph = [
    "langgraph>=0.2",
]
agno = [
    "agno>=1.0",
]
crewai = [
    "crewai>=0.80",
]
autogen = [
    "autogen-agentchat>=0.4",
]
llama-index = [
    "llama-index-core>=0.11",
]
pydantic-ai = [
    "pydantic-ai>=0.0.14",
]
semantic-kernel = [
    "semantic-kernel>=1.0",
]
openai-agents = [
    "openai-agents>=0.1",
]
langchain = [
    "langchain-core>=0.3",
]
google-adk = [
    "google-adk>=1.0",
]
smolagents = [
    "smolagents>=1.0",
]
dspy = [
    "dspy>=2.5",
]
strands = [
    "strands-agents>=1.0",
]
letta = [
    "letta-client>=0.1",
]
griptape = [
    "griptape>=1.0",
]
ag2 = [
    "ag2>=0.7",
]
atomic-agents = [
    # atomic-agents 2.x requires Python >=3.12; harmless no-op on 3.11.
    "atomic-agents>=2.0; python_version >= '3.12'",
]
mcp = [
    "mcp>=1.0,<3",
]
integrations = [
    "unplug-ai[langgraph,agno,crewai,autogen,llama-index,pydantic-ai,semantic-kernel,openai-agents,langchain,google-adk,smolagents,dspy,strands,letta,griptape,ag2,atomic-agents,haystack,mcp]",
]
# `all` = capability extras only. Agent-framework adapters install via the
# `integrations` meta-extra (or one framework at a time) so the default CI
# matrix and `uv sync --all-extras` don't drag in every agent SDK and couple
# unrelated dependency trees. Live framework coverage runs in the dedicated
# `integrations-live` CI job (see integrations/TESTING.md).
all = ["unplug-ai[ml,scrape,litellm,yara,haystack,presidio]"]

[project.urls]
Homepage = "https://unplug-ai.org"
Repository = "https://github.com/UnplugAI/Unplug"
Issues = "https://github.com/UnplugAI/Unplug/issues"
Documentation = "https://github.com/UnplugAI/Unplug/blob/dev/docs/GETTING_STARTED.md"
Integrations = "https://github.com/UnplugAI/Unplug/tree/dev/sdk/integrations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unplug"]
include = [
    "src/unplug/py.typed",
    "src/unplug/data/**",
    "src/unplug/audit/data/*.json",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "S",   # flake8-bandit (security)
]
ignore = [
    "SIM108",  # ternary - often less readable in security code
    "RUF001",  # ambiguous unicode - required in homoglyph maps and attack fixtures
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests use asserts (S101), fake secrets (S105), /tmp paths (S108), and shell/
# subprocess helpers (S6xx) by design; bandit checks there add noise, not safety.
"tests/**" = [
    "N802",
    "N803",
    "RUF001",
    "RUF003",
    "RUF012",
    "B011",
    "S101",
    "S105",
    "S108",
    "S110",
    "S112",
    "S603",
    "S604",
    "S607",
]
"benchmarks/**" = ["S101"]
"src/unplug/core/normalize/normalize.py" = ["RUF001", "RUF003", "SIM102"]
"src/unplug/safeguards/__init__.py" = ["E402"]
# `token` here is a tool-permission keyword (read/write/execute), not a credential.
"src/unplug/core/agent/toolchain.py" = ["S105"]
# Type-narrowing asserts after lazy model load; not runtime control flow.
"src/unplug/ml/span_model.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["unplug", "benchmarks"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
# Gate scoped to the type-clean packages. ml/, data/, integrations/, and a few
# others still carry typing debt (mostly untyped torch/transformers + yaml.object
# returns) — see the typing-debt notes before widening this list.
files = [
    "src/unplug/api",
    "src/unplug/audit",
    "src/unplug/cli",
    "src/unplug/config",
    "src/unplug/core",
    "src/unplug/pipelines",
    "src/unplug/scanners",
    "src/unplug/guard.py",
    "src/unplug/guard_scan.py",
    "src/unplug/models.py",
]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

# Heavy ML / optional third-party deps ship no type stubs; don't fail on them.
[[tool.mypy.overrides]]
module = [
    "transformers.*",
    "torch.*",
    "onnxruntime.*",
    "yara.*",
    "presidio_analyzer.*",
    "haystack.*",
    "litellm.*",
    "firecrawl.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Wall-clock scan-latency assertions in tests/security/test_security_stress.py
# are deselected from the default gate: shared CI runners (and loaded dev
# machines) vary too much for absolute time budgets, and a flake here looks
# like a real regression on an unrelated PR (#144). They run on a schedule /
# manual dispatch via .github/workflows/slow-stress.yml and locally via
# `make test-slow`. The policy lives in the test file so the budgets are not
# "fixed" by nudging the numbers.
addopts = ["-m", "not requires_docker and not slow"]
markers = [
    "requires_ml_weights: tests needing checkpoint weight files on disk",
    "requires_docker: tests needing docker daemon (sidecar E2E)",
    "requires_presidio: tests needing presidio-analyzer extra",
    "requires_yara: tests needing yara-python extra",
    "requires_ml: tests needing ML stack extra",
    "requires_integrations: tests needing agent framework extras",
    "slow: wall-clock stress tests; excluded from the default/PR gate, run via the nightly slow-stress workflow or `make test-slow`",
]
filterwarnings = [
    "ignore:clean_up_tokenization_spaces:FutureWarning:transformers.tokenization_utils_base",
    "ignore::DeprecationWarning:torch.jit._script",
    "ignore:builtin type swigvarlink:DeprecationWarning",
    "ignore:builtin type SwigPyPacked:DeprecationWarning",
    "ignore:builtin type SwigPyObject:DeprecationWarning",
    "ignore:unplug.safeguards:DeprecationWarning",
    "ignore:unplug.core.:DeprecationWarning",
]

[project.scripts]
unplug-audit = "unplug.cli.audit:main"
unplug-models = "unplug.cli.models:main"
unplug-sidecar = "unplug.cli.sidecar:main"
unplug-scan-pr = "unplug.cli.scan_pr:main"

[dependency-groups]
dev = [
    "datasets>=4.8.5",
    "mypy>=2.1.0",
    "pyarrow>=24.0.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.4",
    "types-pyyaml>=6.0.12.20260518",
]
