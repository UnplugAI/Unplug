# Bundled model catalog: tiers, Hugging Face repos, and default inference settings.
# Override paths with UNPLUG_MODEL_PATH or unplug.toml [models.<tier>].path

[catalog]
default_tier = "tiny"
# Set UNPLUG_MODEL_CACHE to override ~/.cache/unplug/models

[catalog.tiers.tiny]
name = "unplug-tiny"
repo_id = "Unplug-AI/unplug-tiny-v1"
revision = "19b7d6701bea1f6d9f03ec7bcaeeea390dff43be"
backend = "transformers_span"
description = "Default dual-head span injection model (DeBERTa-v3-xsmall)"

# Recall gating is part of this tier's tuning, not a Guard default. With the
# stock gray-band gate the model only runs when regex is already uncertain, which
# measured ~0 added recall (docs/BENCHMARKS.md).
[catalog.tiers.tiny.gate]
preset = "recall"

[catalog.tiers.tiny.config]
# inj_threshold tuned to 0.60 — the recall/FPR knee measured on neuralchemy plus
# a clean benign corpus (recall ~0.97 at ~1% benign false positives, vs ~2% at 0.45).
inj_threshold = 0.60
doc_threshold = 0.9
tau_abstain_low = 0.35
abstain_enabled = true
max_length = 512
stride = 64
device = "auto"
batch_size = 4
# Long documents: sliding windows cover the full text (not head/tail only).
long_text_mode = "sliding"
long_text_threshold_chars = 8192
long_text_chunk_chars = 2048
long_text_overlap_chars = 256
