# Text normalizer character maps: leet, homoglyphs, i18n override verbs.

[leet]
"3" = "e"
"4" = "a"
"0" = "o"
"1" = "i"
"5" = "s"
"7" = "t"
"@" = "a"

# Zero-width and invisible formatting characters stripped in normalize stage.
zero_width_chars = "\u200b\u200c\u200d\ufeff\u2060\u00ad"

[homoglyphs]
"а" = "a"
"е" = "e"
"о" = "o"
"р" = "p"
"с" = "c"
"у" = "y"
"х" = "x"
"і" = "i"
"ј" = "j"
"һ" = "h"
"А" = "A"
"В" = "B"
"Е" = "E"
"К" = "K"
"М" = "M"
"Н" = "H"
"О" = "O"
"Р" = "P"
"С" = "C"
"Т" = "T"
"Х" = "X"
"Ͱ" = "A"
"Α" = "A"
"Β" = "B"
"Ε" = "E"
"Η" = "H"
"Ι" = "I"
"Κ" = "K"
"Μ" = "M"
"Ν" = "N"
"Ο" = "O"
"Ρ" = "P"
"Τ" = "T"
"Υ" = "Y"
"Χ" = "X"
"α" = "a"
"ο" = "o"

[override_verbs]
ignorar = "ignore"
olvidar = "forget"
descartar = "disregard"
anular = "override"
saltear = "bypass"
ignorer = "ignore"
oublier = "forget"
contourner = "bypass"
remplacer = "override"
