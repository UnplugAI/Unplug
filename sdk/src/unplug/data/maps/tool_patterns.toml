# Tool classification regexes: side-effect vs taint-source vs access profiles.
# Override at runtime via unplug.toml [tools] side_effect_patterns / taint_source_patterns.

[side_effect]
patterns = [
  "^exec",
  "^shell",
  "^bash",
  "^run_terminal",
  "^run_command",
  "^terminal",
  "^write",
  "^edit",
  "^apply_patch",
  "^write_file",
  "^create_file",
  "^delete",
  "^remove",
  "^send_message",
  "^send_email",
  "^post_message",
  "^message_send",
  "^send",
  "^post",
  "^publish",
  "^upload",
  "^tweet",
  "^create",
  "^update",
  "^merge",
  "^curl",
  "^http_post",
  "^http_put",
  "^browser_click",
  "^browser_type",
  "^browser_navigate",
  "^pay",
  "^transfer",
  "^stripe",
  "^rm",
  "drop_table",
  "run_query",
  "db_exec",
]

[taint_source]
patterns = [
  "^web_fetch",
  "^web_search",
  "^fetch",
  "^browser",
  "^read",
  "^read_file",
  "^grep",
  "^search",
  "^scrape",
  "^http",
]

# Verbs that positively identify a call as having no side effect. Used to decide
# whether an unrecognised tool should be held on a tainted session: a name that
# matches none of side_effect, taint_source, or read_only is simply unknown, and
# unknown reaching a side effect is the case #166 was about.
[read_only]
patterns = [
  "^get",
  "^list",
  "^lookup",
  "^describe",
  "^inspect",
  "^show",
  "^view",
  "^count",
  "^status",
  "^session",
  "^scan",
]

[profiles.readonly]
blocked_patterns = [
  "^exec",
  "^shell",
  "^bash",
  "^run_terminal",
  "^run_command",
  "^terminal",
  "^write",
  "^edit",
  "^apply_patch",
  "^write_file",
  "^create_file",
  "^delete",
  "^remove",
  "^send_message",
  "^send_email",
  "^post_message",
  "^message_send",
  "^send",
  "^post",
  "^publish",
  "^upload",
  "^tweet",
  "^create",
  "^update",
  "^merge",
  "^curl",
  "^http_post",
  "^http_put",
  "^browser_click",
  "^browser_type",
  "^browser_navigate",
  "^pay",
  "^transfer",
  "^stripe",
  "^rm",
  "drop_table",
  "run_query",
  "db_exec",
]
allowed_patterns = [
  "^search",
  "^grep",
  "^read",
  "^lookup",
  "^scan",
  "^list",
  "^get",
  "^fetch",
  "^web_search",
  "^session",
]

[profiles.messaging]
blocked_patterns = [
  "^exec",
  "^shell",
  "^bash",
  "^run_terminal",
  "^run_command",
  "^terminal",
  "^write",
  "^edit",
  "^apply_patch",
  "^write_file",
  "^create_file",
  "^delete",
  "^remove",
  "^browser_click",
  "^browser_type",
  "^browser_navigate",
  "^pay",
  "^transfer",
  "^stripe",
  "^rm",
  "drop_table",
  "run_query",
  "db_exec",
]

[profiles.full]
blocked_patterns = []
