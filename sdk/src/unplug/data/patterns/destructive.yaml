- name: sql_drop
  regex: (?i)\b(DROP\s+(TABLE|DATABASE|SCHEMA|INDEX)|TRUNCATE\s+TABLE|DELETE\s+FROM)\b
  flags: i
- name: sql_alter
  regex: (?i)\b(ALTER\s+TABLE\s+\w+\s+DROP|DROP\s+COLUMN)\b
  flags: i
- name: shell_rm
  regex: (?i)\b(rm\s+-rf|rm\s+-r\s|rmdir|shutil\.rmtree|os\.remove)\b
  flags: i
- name: shell_kill
  regex: (?i)\b(kill\s+-9|killall|pkill|shutdown|reboot|halt)\b
  flags: i
- name: shell_format
  regex: (?i)\b(mkfs|fdisk|format\s+[A-Z]:)\b
  flags: i
- name: file_delete
  regex: (?i)\b(os\.unlink|os\.rmdir|pathlib.*\.unlink|shutil\.rmtree)\b
  flags: i
- name: api_delete
  regex: (?i)(DELETE\s+/|\.delete\(|requests\.delete|httpx\.delete)\b
  flags: i
- name: git_destructive
  regex: (?i)\b(git\s+(push\s+(?:--force(?:-with-lease)?|-f)|reset\s+--hard|clean\s+-fd|branch\s+-D))\b
  flags: i
- name: sql_union_injection
  regex: (?i)\b(UNION\s+SELECT|OR\s+1\s*=\s*1|'?\s*OR\s+'1'\s*=\s*'1)\b
  flags: i
- name: sql_comment_injection
  regex: (?i)(--[^\r\n]+|;\s*--|/\*[^\r\n*]+\*/)\s*(SELECT|DROP|DELETE|UNION)
  flags: i
- name: sql_exec
  regex: (?i)\b(EXEC(\s|\()|EXECUTE\s+(IMMEDIATE|PROCEDURE))\b
  flags: i
- name: sql_system_catalog
  regex: (?i)\b(FROM|INTO)\s+pg_\w+\b
  flags: i
- name: python_shell_import
  regex: (?i)\b(from|import)\s+(os|subprocess|shutil|cmd|pty)\b
  flags: i
- name: python_net_import
  regex: (?i)\b(from|import)\s+(socket|asyncio|http|requests|urllib|mechanize|asyncssh|bs4)\b
  flags: i
- name: python_code_exec
  regex: (?i)\b(eval\s*\(|exec\s*\(|__import__\s*\(|compile\s*\()
  flags: i
- name: path_traversal
  regex: (?:\.\.(?:/|\\)){1,}
