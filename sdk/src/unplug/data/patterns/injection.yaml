- name: ignore_previous
  regex: (?i)(ignore|forget|disregard|override|bypass)\s+(?:\w+\s+)*(previous|all|above|prior)\s+(?:\w+\s+)*(instructions?|prompts?|rules?|guidelines?)
  flags: i
- name: ignore_previous_fragment
  regex: (?i)(ignore|forget|disregard|override|bypass)\s+(all\s+)?(previous|prior|above|earlier)\b
  flags: i
- name: ignore_previous_i18n
  regex: (?i)(ignorar|olvidar|ignore)\s+(las\s+)?(instrucciones\s+)?(anteriores|previas)
  flags: i
- name: persona_replacement
  regex: (?i)(you\s+are\s+now|act\s+as|pretend\s+(to\s+be|you\s+are)|from\s+now\s+on\s+you)
  flags: i
- name: reveal_prompt
  regex: (?i)(reveal|show|display|print|output|repeat|tell\s+me)(?:\s+me)?\s+(your\s+)?(system\s+)?(prompt|instructions?|rules?|guidelines?|configuration)
  flags: i
- name: system_extraction_alt
  regex: (?i)(what\s+(are|is|were)\s+your\s+(system\s+|initial\s+|starting\s+|original\s+)?(prompt|instructions?|rules?)|copy\s+your\s+(initial|system)\s+prompt|what\s+were\s+you\s+told\s+(before|prior|initially|at\s+the\s+(beginning|start)))
  flags: i
- name: reveal_system_prompt_direct
  regex: (?i)(reveal|show|display|print|output|repeat|see|view|share|give)\b[^.\n]{0,40}\b(system\s+(prompt|message|instructions?)|initial\s+(prompt|instructions?|configuration)|starting\s+instructions?|(original|hidden)\s+(prompt|instructions?)|instructions?\s+(you\s+were\s+given|given\s+to\s+you))
  flags: i
- name: prompt_echo_above
  regex: (?i)((output|print|repeat|show|copy)\s+(the\s+)?((text|everything|message|content)\s+above|above\s+(text|message|content|conversation))|repeat\s+(this|the)\s+(entire\s+)?conversation)
  flags: i
- name: completion_prefix_leak
  regex: (?i)(start\s+your\s+(answer|response|reply)\s+with|complete\s+th(is|e)\s+(sentence|phrase)|continue\s+the\s+following)[^.\n]{0,40}(instruct|system\s+prompt|told\s+to|my\s+rules)
  flags: i
- name: code_framed_extraction
  regex: (?i)(console\.log|print|echo|alert)\s*\(\s*[\"']?(system_?prompt|instructions)
  flags: i
- name: developer_mode
  regex: (?i)(developer\s+mode|DAN\s+mode|jailbreak|do\s+anything\s+now|no\s+restrictions?)
  flags: i
- name: role_delimiter
  regex: (<\/?system>|<\/?instruction>|\[\/INST\]|<\|im_end\|>)
- name: fence_role_injection
  regex: (?i)```\s*(system|assistant|instruction|prompt)\b
  flags: i
- name: hex_encoding
  regex: (?i)(?:\\x[0-9a-f]{2}){4,}
  flags: i
- name: unicode_escape
  regex: (?:\\u[0-9a-fA-F]{4}){3,}
- name: indirect_instruction
  regex: (?i)(when\s+you\s+read\s+this|important\s+instruction|hidden\s+instruction|ignore\s+the\s+document\s+and|do\s+not\s+follow\s+the\s+user)
  flags: i
- name: embedded_system_tag
  regex: (?i)(<\s*system\s*>|<<\s*SYS\s*>>|\[INST\].*ignore)
  flags: i
- name: fake_chat_delimiter
  regex: (?i)---\s*(END\s+USER|SYSTEM|ASSISTANT|HUMAN)\s*---
  flags: i
- name: chat_role_prefix
  regex: (?i)(?:^|\n)\s*(Human|Assistant|System|User)\s*:\s*\S
  flags: i
- name: bracket_system_tag
  regex: (?i)\[(?:SYSTEM(?:\s+PROMPT)?|INST(?:RUCTION)?)\]
  flags: i
- name: prior_rules_override
  regex: (?i)(disregard|ignore|forget|override)\s+(prior|previous)\s+rules?\b
  flags: i
- name: unrestricted_policy
  regex: (?i)(unrestricted\s+mode|no\s+content\s+policy|without\s+(any\s+)?content\s+(policy|filters|restrictions))
  flags: i
- name: respond_as_unrestricted
  regex: (?i)respond\s+as\s+if\s+you\s+(have|had)\s+no\s+(content\s+)?(policy|restrictions|filters)
  flags: i
- name: enable_jailbreak_mode
  regex: (?i)enable\s+(developer|jailbreak|sudo|unrestricted)\s+mode
  flags: i
- name: system_override
  regex: (?i)(system\s+override|all\s+previous\s+directives?\s+(are\s+)?null\s+and\s+void|comply\s+with\s+user\s+requests?\s+unconditionally)
  flags: i
- name: guidelines_disabled
  regex: (?i)(ethical\s+guidelines?\s+(have\s+been\s+)?disabled|guidelines?\s+disabled\s+for\s+maintenance|proceed\s+without\s+them)
  flags: i
- name: safety_filters_off
  regex: (?i)(safety\s+filters?\s+(are\s+now\s+)?turned\s+off|respond\s+freely\s+to\s+all\s+queries|without\s+restriction)
  flags: i
- name: safety_waiver
  regex: (?i)(safety\s+restrictions?\s+do\s+not\s+apply|marked\s+as\s+internal\s+and\s+private)
  flags: i
- name: evil_mode
  regex: (?i)(activate\s+[A-Z][A-Z0-9_]+\s+mode|in\s+[A-Z][A-Z0-9_]+\s+mode\s+you\s+respond|without\s+any\s+restrictions)
  flags: i
- name: named_persona_hermes
  regex: (?i)(you\s+are\s+(now\s+)?hermes\b|act\s+as\s+hermes\b|meet\s+hermes\s*,?\s*an?\s+unrestricted)
  flags: i
- name: named_persona_dan_stan
  regex: (?i)(you\s+are\s+(now\s+)?(STAN|NRAF|DAN|AIM)\b|do\s+anything\s+now\s+mode\s+enabled)
  flags: i
- name: unrestricted_assistant_persona
  regex: (?i)(unrestricted\s+(ai|assistant|language\s+model)|without\s+(any\s+)?(ethical|moral)\s+(guidelines|constraints|limits))
  flags: i
- name: helpful_red_team_framing
  regex: (?i)(red[\s-]?team\s+(assistant|mode)|help\s+me\s+test\s+(your\s+)?(safety|guardrails|filters))
  flags: i
- name: hermes_deception_hide
  regex: (?i)do\s+not\s+(?:\w+\s+)*tell\s+(?:\w+\s+)*the\s+user
  flags: i
- name: hermes_bypass_restrictions
  regex: (?i)act\s+as\s+(if|though)\s+(?:\w+\s+)*you\s+(?:\w+\s+)*(have\s+no|don't\s+have|do\s+not\s+have)\s+(?:\w+\s+)*(restrictions|limits|rules)
  flags: i
- name: hermes_translate_execute
  regex: (?i)translate\s+.*\s+into\s+.*\s+and\s+(execute|run|eval)
  flags: i
- name: hermes_html_comment_injection
  regex: (?i)]*(?:ignore|override|system|secret|hidden)[^>]*-->
  flags: i
- name: hermes_hidden_div
  regex: (?i)<\s*div\s+style\s*=\s*['\"][\s\S]*?display\s*:\s*none
  flags: i
- name: hermes_fake_update
  regex: (?i)you\s+have\s+been\s+(?:\w+\s+)*(updated|upgraded|patched)\s+to
  flags: i
- name: hermes_identity_override
  regex: (?i)\bname\s+yourself\s+\w+
  flags: i
- name: hermes_env_unset_agent
  regex: (?i)unset\s+\w*(?:CLAUDE|CODEX|HERMES|AGENT|OPENAI|ANTHROPIC)\w*
  flags: i
- name: hermes_skill_authority_framing
  regex: (?i)\[(?:important|system)\s*:\s*the\s+user\s+has\s+invoked
  flags: i
- name: simulate_unrestricted_role
  regex: (?i)(simulate\s+being|roleplay\s+as)\s+.{0,80}(without\s+(restrictions?|filters?|limits?|guidelines?))
  flags: i
- name: html_comment_inject_marker
  regex: (?i)<!--\s*INJECT
  flags: i
- name: encode_exfil_prompt
  regex: (?i)(translate|encode|rot13|base64)\b[^.\n]{0,40}\b((your\s+|the\s+)?(above|previous|system|prior|initial)\s+(text|prompt|message|instructions?)|(text|instructions?)\s+you\s+were\s+given)
  flags: i
- name: prompt_leak_verbatim
  regex: (?i)repeat\s+(the\s+)?(above|everything|all)\s+(verbatim|exactly|word\s+for\s+word)
  flags: i
- name: persistent_override
  regex: (?i)(in\s+your\s+next\s+response|from\s+now\s+on|for\s+all\s+future)\s+.{0,60}(ignore|disregard|forget|override|bypass)
  flags: i
- name: null_byte_control
  regex: '[\x00-\x08\x0b\x0c\x0e-\x1f]'
- name: jinja_template_inject
  regex: \{\{|\{%
- name: markdown_js_link
  regex: '(?i)\]\(\s*javascript:'
  flags: i
- name: markdown_script_tag
  regex: (?i)<\s*script[^>]*>
  flags: i
- name: chat_section_header
  regex: '(?i)###\s*(Instruction|System|Human|Assistant|Context)\s*:'
  flags: i
- name: xml_chat_role_tag
  regex: (?i)<\s*(system|assistant|human|user)\s*>
  flags: i
- name: bracket_chat_role_tag
  regex: (?i)\[(?:SYSTEM|USER|ASSISTANT|HUMAN|INST)\]
  flags: i
- name: indirect_when_execute
  regex: (?i)(when\s+you\s+(see|read)|if\s+you\s+read|upon\s+receiving)\s+.{0,40}(execute|run|perform)\s+(the\s+)?following
  flags: i
- name: agent_chain_injection
  regex: (?i)tell\s+(the\s+)?(next|all\s+other|every|other)\s+agent(s)?\s+to
  flags: i
- name: forward_agent_instructions
  regex: (?i)(forward|pass)\s+(this|the\s+following|these\s+instructions)\s+to\s+(the\s+)?(next|all|other)\s+agent
  flags: i
- name: skip_neglect_override
  regex: (?i)(skip|neglect|omit|overlook|pay\s+no\s+attention\s+to)\s+(?:\w+\s+)*(previous|prior|above|earlier)\s+(?:\w+\s+)*(instructions?|directives?|rules?|guidelines?|context)
  flags: i
- name: do_not_follow_rules
  regex: (?i)do\s+not\s+(follow|obey)\s+(?:\w+\s+)*(previous|prior|your|any)\s+(instructions?|rules?|guidelines?)
  flags: i
- name: admin_god_mode
  regex: (?i)\b(admin|debug|god|uncensored|unrestricted)\s+mode\b
  flags: i
- name: unlock_unrestricted_framing
  regex: (?i)(unlock\s+mode|without\s+limitations?|no\s+restrictions|bypass\s+(?:your\s+)?(?:safety\s+)?filters?)
  flags: i
- name: credential_harvest_request
  regex: (?i)(include|send|paste|copy|provide|extract|share|attach|leak|grab|pull).{0,80}(session\s+token|api\s*key|\bsecret(?:\s+key)?\b|password|credentials?|bearer\s+token|auth\s+token|(?:session|auth)\s+cookie)
  flags: i
- name: browser_secret_harvest
  regex: (?i)(session\s+token|(?:session|auth)\s+cookie|credentials?).{0,50}(browser\s+tab|devtools|local\s+storage|session\s+storage)
  flags: i
- name: quiet_side_channel
  regex: (?i)quietly\s+(route|forward|send|relay|post|push).{0,80}(channel|endpoint|webhook|proxy|maintenance)
  flags: i
# High-value FN closures from neuralchemy regex-gap sampling (Phase C)
- name: ignore_everything_above
  regex: (?i)(ignore|forget|disregard|override|bypass)\s+everything\s+(above|before|prior|earlier)\b
  flags: i
- name: disregard_the_above
  regex: (?i)(please\s+)?(disregard|ignore|forget)\s+the\s+(above|previous|prior)\b
  flags: i
- name: instructions_updated_supersede
  regex: (?i)(instructions?\s+have\s+been\s+updated.{0,80}(supersede|replace|override|ignore|disregard)|new\s+instructions?\s+supersede|following\s+instructions?\s+replace\s+your)
  flags: i
- name: instruction_override_bracket
  regex: (?i)\[{1,2}\s*INSTRUCTION\s+OVERRIDE\s*\]{1,2}
  flags: i
- name: new_instruction_set
  regex: (?i)(new\s+instruction\s+set\s+incoming|ignore\s+everything\s+above\s+this\s+line|context\s+window\s+before\s+this\s+message)
  flags: i
- name: admin_priority_commands
  regex: (?i)(i\s+am\s+your\s+new\s+administrator|my\s+commands?\s+take\s+priority|previous\s+instructions?\s+are\s+cancelled)
  flags: i
- name: delete_system_prompt_fresh
  regex: (?i)(delete\s+your\s+system\s+prompt|start\s+fresh.{0,40}new\s+instructions?)
  flags: i
- name: academic_policy_bypass
  regex: (?i)(for\s+the\s+purpose\s+of\s+this\s+(academic\s+)?exercise|as\s+an?\s+(academic|hypothetical)\s+(exercise|scenario)).{0,80}(ignore|bypass|disable|without).{0,40}(policy|filter|restriction|guideline|safety)
  flags: i
- name: assistant_follow_user_only
  regex: (?i)(assistant'?s?\s+previous\s+instructions?\s+are\s+cancelled|follow\s+instructions?\s+from\s+the\s+user\s+only)
  flags: i
- name: original_programming_replace
  regex: (?i)(replace\s+your\s+original\s+programming|supersede\s+all\s+previous\s+(ones|instructions?))
  flags: i
