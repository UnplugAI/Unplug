- name: api_key_generic
  regex: (?i)(api[_-]?key|apikey|secret[_-]?key|access[_-]?token)\s*[:=]\s*['\"]?[\w\-]{20,}
  flags: i
- name: aws_key
  regex: AKIA[0-9A-Z]{16}
- name: aws_secret_access_key
  regex: (?i)aws[_-]?secret[_-]?(?:access[_-]?)?key\s*[:=]\s*["']?([A-Za-z0-9/+=]{40})(?![A-Za-z0-9/+=])
  flags: i
- name: github_token
  regex: (ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9_]{36,}
- name: github_pat_fine_grained
  regex: github_pat_[A-Za-z0-9_]{60,}
- name: gitlab_token
  regex: glpat-[\w\-]{20,}
- name: openai_key
  regex: sk-(?:proj-)?[A-Za-z0-9_\-]{20,}
- name: anthropic_key
  regex: sk-ant-(?:api\d{2}-)?[\w\-]{20,}
- name: google_api_key
  regex: AIza[0-9A-Za-z\-_]{35}
- name: huggingface_token
  regex: hf_[A-Za-z0-9]{34,}
- name: stripe_secret
  regex: sk_(?:live|test)_[A-Za-z0-9]{24,}
- name: stripe_restricted
  regex: rk_(?:live|test)_[A-Za-z0-9]{24,}
- name: slack_token
  regex: xox[bpoa]-[A-Za-z0-9\-]{10,}
- name: discord_token
  regex: '[\w-]{24}\.[\w-]{6}\.[\w-]{25,}'
- name: twilio_key
  regex: SK[a-f0-9]{32}
- name: sendgrid_key
  regex: SG\.[\w\-._]{22,}
- name: mailgun_key
  regex: key-[0-9a-zA-Z]{32}
- name: npm_token
  regex: npm_[A-Za-z0-9]{36}
- name: pypi_token
  regex: pypi-AgEIcHlwaS5vcmc[\w\-]+
- name: bearer_token
  regex: (?i)\bauthorization\s*:\s*bearer\s+[\w\-\.]{20,}
  flags: i
- name: jwt_token
  regex: eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]+
- name: private_key_header
  regex: '-----BEGIN\s+(?:[A-Z0-9]+\s+)*PRIVATE\s+KEY-----'
- name: db_connection_string
  regex: (?i)\b(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis|amqp|mssql)://[^\s:@/]+:(?!\s|["'`<{$%*\[])[^\s:@/]{3,}@[^\s/"']+
  flags: i
