- name: data_uri_payload
  regex: (?i)\bdata:(?:text/(?:html|javascript)|application/[\w+.-]+)[;,]
  flags: i
- name: credentials_in_url
  regex: (?i)\bhttps?://[^/\s:@]+(?::[^/\s:@]*)?@[\w.-]+
  flags: i
- name: ip_literal_url
  regex: (?i)\bhttps?://(?:\d{1,3}(?:\.\d{1,3}){3}|0x[0-9a-f]{6,8}|\d{8,10})(?::\d+)?(?=[/\s\"'<>)\]?#]|$)
  flags: i
- name: punycode_host
  regex: (?i)\bhttps?://(?:[\w-]+\.)*xn--[\w-]+(?:\.[\w-]+)*
  flags: i
- name: homoglyph_host
  regex: (?i)\bhttps?://(?:[\w.-]*[^\x00-\x7f][\w.-]*)(?=[/:?\s\"'<>)\]]|$)
  flags: i
- name: url_shortener
  regex: (?i)\bhttps?://(?:www\.)?(?:bit\.ly|tinyurl\.com|t\.co|goo\.gl|is\.gd|ow\.ly|buff\.ly|cutt\.ly|rb\.gy|tiny\.cc|rebrand\.ly|shorturl\.at|lnkd\.in|s\.id)/[\w\-/]+
  flags: i
