# Unplug configuration: copy to unplug.toml and customize

[guard]
scanners = ["injection", "destructive", "leakage", "harmful", "urls"]
# Add "pii" for Microsoft Presidio NER (pip install "unplug-ai[presidio]")
# scanners = ["injection", "destructive", "leakage", "harmful", "urls", "pii"]
# mode: "local" (default) | "server" (hosted API)
mode = "local"
# server_url = "https://api.unplug.example"
# server_api_key = "up_live_xxxxxxxx"

# Local ML (optional — requires pip install "unplug-ai[ml]"):
# active_model = "tiny"
# auto_download_model = true
# require_ml = false

[limits]
max_input_chars = 50000
# max_input_tokens = 8192   # estimated offline (max of words and chars/4); off by default
max_tool_calls_per_session = 100
blocked_tools = []

[tools]
enabled = true
session_taint_enabled = true
tainted_side_effect_review_score = 0.35
# profile = "readonly"   # readonly | messaging | full

[toolchain]
enabled = true
history_size = 20

[collusion]
enabled = true
window_seconds = 60.0
pair_message_threshold = 10
cross_agent_window_seconds = 120.0

[boundaries]
auto_wrap_untrusted = true
sanitize_before_wrap = true
strip_on_output = false

[trajectory]
enabled = true
window = 5
min_samples = 3
review_slope = 0.08
block_slope = 0.15

[intent]
enabled = true
review_score = 0.4

[messages]
blocked_template = "Content was not safe. Threat: {category} (risk {risk_score:.2f})."
review_template = "Review required: {category} (risk {risk_score:.2f})."

[pipeline.thresholds]
block = 0.8
redact = 0.5
review = 0.3

# Hybrid regex-to-ML routing: skip ML when regex is already confident.
[pipeline.ml_gate]
# gray_high = 0.8        # skip ML at/above this regex risk (default: block threshold)
always_below_high = true # false = run ML only in the gray band or on a regex flag
# When always_below_high = false, set a positive floor or the skip is a no-op:
# gray_low = 0.3         # below this (and nothing flagged) ML is skipped

# Per-scanner overrides
[scanners.injection]
base_score = 0.85
normalize = true

[scanners.destructive]
base_score = 0.90

# [scanners.pii]
# base_score = 0.80

# --- Hosted mode (server) ---
# Set mode = "server" and credentials (or env UNPLUG_SERVER_URL + UNPLUG_API_KEY).
# Text scan/output run on the server; check_tool_call() always runs locally.

# --- Local ML mode ---
# pip install "unplug-ai[ml]"
# unplug-models download tiny
# Or: export UNPLUG_MODEL_PATH=/path/to/checkpoint-66630
# Dual-head checkpoint: config.json must include "dual_head": true

# Catalog default: repo_id = "Unplug-AI/unplug-tiny-v1" (see src/unplug/data/catalog.toml)
# Override only for offline/air-gapped: path = "/path/to/checkpoint"

[policy]
abstain_enabled = true
tau_abstain_low = 0.35
# decision_mode: how ML doc/span heads combine: doc_or_span | doc_only | doc_gated
decision_mode = "doc_or_span"
# doc_gated only: doc alone (no span corroboration) detects at/above this bar.
# Must be above the doc threshold (0.95) or the gate has no effect.
tau_doc_gate = 0.99
sensitive_context_enabled = true
sensitive_context_boost = 0.2
sensitive_context_block_delta = 0.15
# abstain_is_safe = false  # default; set true for legacy ABSTAIN pass-through to model

[models.tiny.config]
max_length = 512
stride = 64
inj_threshold = 0.45
doc_threshold = 0.9
tau_abstain_low = 0.35
abstain_enabled = true
device = "auto"
long_text_mode = "sliding"
long_text_threshold_chars = 8192
long_text_chunk_chars = 2048
long_text_overlap_chars = 256

[models.medium]
name = "unplug-medium"
backend = "transformers_span"
path = "/path/to/unplug-medium-checkpoint"

[models.large]
name = "unplug-large"
backend = "transformers_span"
path = "/path/to/unplug-large-checkpoint"
